<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Pulau Melayang Zelda</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background-color: #a9dce9;
      background-image: url("./assets/zelda-background.png");
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100dvh;
      background: transparent;
      touch-action: none;
    }
  </style>
</head>

<body>
  <canvas
    id="scene"
    aria-label="Pulau melayang dengan karakter Zelda"
  ></canvas>

  <script type="module" src="./main.js"></script>
</body>
</html>
